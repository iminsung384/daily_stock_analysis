          # 스크리너 실행: 기존 STOCK_LIST + 한국 2종목 + 미국 2종목 자동 추가 (실패 시 기존 목록 유지)
          if [ -f "screener.py" ]; then
            SCREENED_STOCKS=$(python screener.py | tail -n 1 || true)
            if [ -n "$SCREENED_STOCKS" ]; then
              export STOCK_LIST="$SCREENED_STOCKS"
            fi
          fi
